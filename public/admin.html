<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅配置 - 优选订阅生成器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.82);
      --border: rgba(148, 163, 184, 0.22);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #34d399;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a 0, var(--bg) 42%, #020617 100%);
      color: var(--text);
      padding: 24px;
    }
    main { max-width: 960px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    p { color: var(--muted); line-height: 1.7; }
    label { display: block; margin: 18px 0 8px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.68);
      color: var(--text);
      padding: 14px;
      font: inherit;
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #020617;
      font-weight: 800;
      padding: 12px 18px;
      margin: 14px 10px 0 0;
      cursor: pointer;
    }
    button.secondary { background: rgba(148, 163, 184, 0.18); color: var(--text); border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 18px; }
    .item { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: rgba(2, 6, 23, 0.35); }
    .key { color: var(--muted); font-size: 12px; }
    .value { margin-top: 6px; word-break: break-all; }
    .status { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: rgba(56, 189, 248, 0.12); color: var(--accent); }
    .status.bad { background: rgba(251, 113, 133, 0.12); color: var(--bad); }
    .status.good { background: rgba(52, 211, 153, 0.12); color: var(--good); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>订阅配置</h1>
      <p>这里用于更换你的原始 VLESS 模板。保存后，现有优选 IP 会继续复用新的 UUID、Host、SNI、路径和 TLS 设置。</p>

      <label for="token">管理 token</label>
      <input id="token" type="password" placeholder="粘贴你的管理 token" autocomplete="off" />

      <label for="template">原始 VLESS 链接</label>
      <textarea id="template" placeholder="vless://..."></textarea>

      <button id="load">读取当前模板</button>
      <button id="preview" class="secondary">解析预览</button>
      <button id="save">保存模板</button>

      <div id="message" class="status">请先填写管理 token，或用 /admin.html#token=你的token 打开。</div>
      <div id="previewBox" class="grid"></div>
    </section>

    <section class="card" style="margin-top: 24px;">
      <h1 style="font-size: clamp(22px, 4vw, 32px);">测速趋势</h1>
      <p>展示最近 14 天的测速反馈统计（按天聚合）。数据存储于 D1 或 KV，仅管理 token 可见。</p>

      <label for="trendDays">统计天数</label>
      <input id="trendDays" type="number" min="1" max="90" value="14" />

      <button id="loadTrend">加载趋势</button>

      <div id="trendMessage" class="status">尚未加载。</div>
      <div id="trendStats" class="grid"></div>
      <div id="trendChart"></div>
      <div id="trendColos" class="grid"></div>
    </section>
  </main>

  <script>
    const tokenInput = document.getElementById("token");
    const templateInput = document.getElementById("template");
    const message = document.getElementById("message");
    const previewBox = document.getElementById("previewBox");
    const tokenFromUrl = location.hash.replace(/^#token=/, "").trim();
    if (tokenFromUrl) {
      tokenInput.value = tokenFromUrl;
      history.replaceState(null, "", location.pathname);
    }

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = `status ${type}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function renderPreview(preview) {
      const fields = ["uuid", "address", "port", "security", "type", "host", "sni", "path", "name"];
      previewBox.innerHTML = fields.map((key) => `
        <div class="item">
          <div class="key">${escapeHtml(key)}</div>
          <div class="value">${escapeHtml(preview[key] || "-")}</div>
        </div>
      `).join("");
    }

    async function requestTemplate(method, body) {
      const token = tokenInput.value.trim();
      if (!token) throw new Error("请先填写管理 token");

      const response = await fetch("/api/template", {
        method,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    document.getElementById("load").onclick = async () => {
      try {
        const data = await requestTemplate("GET");
        renderPreview(data.preview);
        setMessage("已读取当前模板安全预览。为避免泄露，系统不会回显完整原始 VLESS。", "good");
      } catch (error) {
        setMessage(error.message, "bad");
      }
    };

    document.getElementById("preview").onclick = () => {
      try {
        const url = new URL(templateInput.value.trim());
        if (url.protocol !== "vless:") throw new Error("必须是 vless:// 链接");
        const params = Object.fromEntries(url.searchParams.entries());
        renderPreview({
          uuid: decodeURIComponent(url.username),
          address: url.hostname,
          port: url.port || "-",
          security: params.security || "none",
          type: params.type || "tcp",
          host: params.host || "-",
          sni: params.sni || params.peer || "-",
          path: params.path ? decodeURIComponent(params.path) : "-",
          name: url.hash ? decodeURIComponent(url.hash.slice(1)) : "-",
        });
        setMessage("解析成功，确认无误后可保存。", "good");
      } catch (error) {
        setMessage(error.message, "bad");
      }
    };

    document.getElementById("save").onclick = async () => {
      try {
        const data = await requestTemplate("POST", { template: templateInput.value.trim() });
        renderPreview(data.preview);
        setMessage("保存成功。订阅接口会立即使用新模板。", "good");
      } catch (error) {
        setMessage(error.message, "bad");
      }
    };

    const trendMessage = document.getElementById("trendMessage");
    const trendStats = document.getElementById("trendStats");
    const trendChart = document.getElementById("trendChart");
    const trendColos = document.getElementById("trendColos");

    function setTrendMessage(text, type = "") {
      trendMessage.textContent = text;
      trendMessage.className = `status ${type}`;
    }

    function renderTrend(summary, storage) {
      const stats = [
        { key: "存储通道", value: storage === "d1" ? "D1" : "KV" },
        { key: "样本总数", value: summary.count ?? 0 },
        { key: "平均速度 (Mbps)", value: summary.averageSpeedMbps ?? "-" },
        { key: "最高速度 (Mbps)", value: summary.maxSpeedMbps ?? "-" },
      ];
      trendStats.innerHTML = stats.map((item) => `
        <div class="item">
          <div class="key">${escapeHtml(item.key)}</div>
          <div class="value">${escapeHtml(item.value)}</div>
        </div>
      `).join("");

      const trend = Array.isArray(summary.trend) ? summary.trend : [];
      const maxSpeed = Math.max(1, ...trend.map((day) => day.maxSpeedMbps || 0));
      const maxCount = Math.max(1, ...trend.map((day) => day.count || 0));
      trendChart.innerHTML = trend.length === 0
        ? `<p>该时间窗口内没有数据。</p>`
        : `<div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));">` +
          trend.map((day) => {
            const avg = day.averageSpeedMbps ?? 0;
            const height = Math.max(4, Math.round((avg / maxSpeed) * 100));
            const tip = `${day.date}\n平均 ${day.averageSpeedMbps ?? "-"} Mbps\n最高 ${day.maxSpeedMbps ?? "-"} Mbps\n样本 ${day.count} / ${maxCount}`;
            return `
              <div class="item" style="padding: 8px; text-align: center;" title="${escapeHtml(tip)}">
                <div style="height: 90px; display: flex; align-items: flex-end; justify-content: center;">
                  <div style="width: 70%; height: ${height}%; background: linear-gradient(180deg, #38bdf8, #818cf8); border-radius: 6px 6px 0 0;"></div>
                </div>
                <div class="key" style="margin-top: 6px; font-size: 10px;">${escapeHtml(day.date.slice(5))}</div>
                <div class="key" style="font-size: 10px;">${day.count}</div>
              </div>
            `;
          }).join("") +
          `</div>`;

      const colos = Array.isArray(summary.coloSummary) ? summary.coloSummary : [];
      trendColos.innerHTML = colos.length === 0
        ? `<p>该时间窗口内没有 COLO 数据。</p>`
        : colos.map((item) => `
          <div class="item">
            <div class="key">${escapeHtml(item.colo)} · ${escapeHtml(item.count)} 次</div>
            <div class="value">${escapeHtml(item.averageSpeedMbps ?? "-")} Mbps</div>
          </div>
        `).join("");
    }

    document.getElementById("loadTrend").onclick = async () => {
      try {
        const token = tokenInput.value.trim();
        if (!token) throw new Error("请先填写管理 token");
        const days = Math.min(90, Math.max(1, Number(document.getElementById("trendDays").value) || 14));
        const response = await fetch(`/api/speedtest-feedback?days=${days}&limit=1000`, {
          headers: { "Authorization": `Bearer ${token}` },
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "请求失败");
        renderTrend(data.summary || {}, data.storage);
        setTrendMessage(`已加载最近 ${days} 天趋势。`, "good");
      } catch (error) {
        setTrendMessage(error.message, "bad");
      }
    };
  </script>
</body>
</html>
