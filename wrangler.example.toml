# 复制为 wrangler.toml 后按需取消注释。
# Pages 项目也可以在 Cloudflare 控制台 "Settings > Bindings" 中直接添加同类绑定。

name = "preferred-sub-generator"
pages_build_output_dir = "public"
compatibility_date = "2026-06-03"

[[kv_namespaces]]
binding = "SUB_KV"
id = "replace_with_your_cloudflare_kv_namespace_id"

# D1：测速反馈的首选存储（趋势面板、按天聚合）。
# 创建方式见 docs/d1-setup.md。
# 未绑定 SPEED_DB 时，代码自动回退到 KV 的 SPEED_FEEDBACK key，功能不受影响。
# [[d1_databases]]
# binding = "SPEED_DB"
# database_name = "speed-feedback"
# database_id = "replace_with_your_d1_database_id"
