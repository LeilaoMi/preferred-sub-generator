name: China Probe (Globalping)

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preferred-sub-generator-china-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 国内三网 TCP 实测
        run: node scripts/china-probe.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_NAMESPACE_ID }}
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          CN_PROBE_BUDGET: ${{ vars.CN_PROBE_BUDGET }}
