name: China Probe (Globalping)

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preferred-sub-generator-cn-kv
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: 自动定位 KV 命名空间
        run: node scripts/cf-bootstrap.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_NAMESPACE_ID }}

      - name: 国内三网 HTTPS 实测
        run: node scripts/china-probe.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          CN_PROBE_BUDGET: ${{ vars.CN_PROBE_BUDGET }}
          COMMUNITY_POOL_URL: ${{ vars.COMMUNITY_POOL_URL }}
          PUBLIC_CN_VERIFIED: ${{ vars.PUBLIC_CN_VERIFIED }}
          SUB_DEFAULT_ISP: ${{ vars.SUB_DEFAULT_ISP }}
          # http（默认）= HTTPS trace 测落地机房；ping = 老的 TCP 握手
          CN_PROBE_MODE: ${{ vars.CN_PROBE_MODE }}
          # 落地机房白名单：US / ASIA / EU 或三字码，空 = 不限
          SUB_LANDING: ${{ vars.SUB_LANDING }}
          VLESS_HOST: ${{ vars.VLESS_HOST }}
          VLESS_SNI: ${{ vars.VLESS_SNI }}
          # 手机 cf-termux-pick 的结构化结果；仓库不存在时 404，自动跳过
          PHONE_RESULTS_URL: ${{ vars.PHONE_RESULTS_URL || format('https://raw.githubusercontent.com/{0}/cf-termux-pick/main/best-ips.json', github.repository_owner) }}
