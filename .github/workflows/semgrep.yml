name: Semgrep
# Pilot: static code scanning, report-only (does not block PRs).
# Note: semgrep-action wrapper is deprecated upstream; this uses the
# native CLI (pip install semgrep + `semgrep scan --config auto`),
# no Semgrep AppSec Platform token required.
# Metrics are left enabled on purpose: `--config auto` requires metrics,
# and dropping `--metrics=off` was the fix for the earlier scan failure.
# The install step deliberately has NO continue-on-error: if pip cannot
# install semgrep, the job must fail loudly instead of silently
# reporting "no findings" (the scan step below already tolerates scan
# failures via continue-on-error, and the upload step is guarded).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep (config auto)
        id: scan
        continue-on-error: true
        run: semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Warn if Semgrep scan failed
        if: steps.scan.outcome == 'failure'
        run: echo "::warning::Semgrep scan failed; no complete results were produced. See the 'Run Semgrep' step log."
      - name: Upload Semgrep results to code scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
