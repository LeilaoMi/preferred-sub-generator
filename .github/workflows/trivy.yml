name: Trivy
# Pilot: filesystem scan (dependency vulnerabilities) + config scan
# (Dockerfile / IaC misconfigurations). Report-only: exit-code 0,
# results go to code scanning as SARIF, nothing blocks the PR.
# The two scans run as independent jobs so a failure in the fs scan
# (or its SARIF upload) cannot skip the config scan, and vice versa.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - name: Upload Trivy fs results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
      - name: Upload Trivy config results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
