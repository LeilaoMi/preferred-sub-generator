name: Update Preferred Subscription

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preferred-sub-generator-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 拉取仓库主人自己的 cf-termux-pick（手机实测结果，需公开）；Fork 没有这个仓库时跳过，沿用现有 manual.txt
      - name: Pull best IPs from cf-termux-pick
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/cf-termux-pick
          path: cf-termux-pick
          sparse-checkout: |
            best-ips.txt

      - name: Sync best-ips to manual source
        run: |
          SRC=cf-termux-pick/best-ips.txt
          DST=sources/edge/manual.txt
          if [ -s "$SRC" ] && grep -qvE '^\s*(#|$)' "$SRC"; then
            # 保留 manual.txt 开头的注释说明，只替换 IP 部分
            grep -E '^\s*#' "$DST" > /tmp/manual.txt || true
            grep -vE '^\s*(#|$)' "$SRC" >> /tmp/manual.txt
            mv /tmp/manual.txt "$DST"
            echo "Synced $(grep -cvE '^\s*(#|$)' "$DST") IPs from cf-termux-pick"
          else
            echo "No usable best-ips.txt, keeping existing manual.txt"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run tests
        run: npm test

      - name: Run preflight checks
        run: npm run preflight

      - name: Validate manual sources
        run: npm run validate:sources

      - name: 自动定位 KV 命名空间
        run: node scripts/cf-bootstrap.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_NAMESPACE_ID }}

      - name: Update Cloudflare KV
        run: node scripts/update-kv.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VLESS_SNI: ${{ vars.VLESS_SNI }}
          VLESS_HOST: ${{ vars.VLESS_HOST }}
          VLESS_SECURITY: ${{ vars.VLESS_SECURITY }}
          ALLOW_RELAY: ${{ vars.ALLOW_RELAY }}
          EDGE_BLACKLIST: ${{ vars.EDGE_BLACKLIST }}
          SUB_LANDING: ${{ vars.SUB_LANDING }}
          CN_PROBE_MODE: ${{ vars.CN_PROBE_MODE }}
          CN_PENDING_MAX: ${{ vars.CN_PENDING_MAX }}
          UPDATE_WEBHOOK_URL: ${{ secrets.UPDATE_WEBHOOK_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
          UPDATE_WEBHOOK_ALWAYS: ${{ vars.UPDATE_WEBHOOK_ALWAYS }}
          ALERT_REPEAT_HOURS: ${{ vars.ALERT_REPEAT_HOURS }}
          ALERT_FALLBACK_THRESHOLD: ${{ vars.ALERT_FALLBACK_THRESHOLD }}
          ALERT_MIN_AVAILABLE: ${{ vars.ALERT_MIN_AVAILABLE }}
          ALERT_DROP_RATIO: ${{ vars.ALERT_DROP_RATIO }}
